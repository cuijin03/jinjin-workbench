<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瑾瑾工作台">
<meta name="theme-color" content="#FFC2CB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>瑾瑾的工作台</title>
<style>
/* ===== 全局变量与基础设定 ===== */
:root {
  --pink-main: #FFC2CB;       /* 桃粉 */
  --pink-light: #FFE4E9;      /* 浅桃粉 */
  --pink-deep: #E88A9A;       /* 深桃粉 */
  --cream: #FFF5E8;           /* 奶白色 */
  --milk: #FFFDFB;            /* 牛奶白 */
  --blue: #BED7F3;            /* 海盐蓝 */
  --blue-light: #E3F0FC;
  --yellow: #FFE8A3;          /* 芝士黄 */
  --yellow-light: #FFF5D6;
  --text-main: #6B545C;       /* 柔和主文字色 */
  --text-soft: #9A858D;       /* 柔和次文字色 */
  --text-light: #C0A8B0;
  --card-bg: rgba(255, 255, 255, 0.97);
  --shadow-soft: 0 4px 16px rgba(255, 194, 203, 0.2);
  --shadow-card: 0 6px 20px rgba(200, 160, 165, 0.12);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  font-family: var(--font);
  background: linear-gradient(160deg, #FFE4E9 0%, #FFF0E8 50%, #FFF5E8 100%);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* 背景装饰贴纸 */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: 0;
  opacity: 0.35;
  pointer-events: none;
}
body::before {
  width: 200px; height: 200px;
  background: radial-gradient(circle, #FFD9E0, transparent 70%);
  top: -60px; right: -60px;
}
body::after {
  width: 250px; height: 250px;
  background: radial-gradient(circle, #E3F0FC, transparent 70%);
  bottom: -80px; left: -80px;
}

/* ===== 主容器 ===== */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 30px;
}

/* 页面容器 - 确保无顶部空白 */
#pages-container {
  position: relative;
  z-index: 1;
  max-width: 480px;
  margin: 0 auto;
  padding: 0;
}

/* ===== 首页布局 ===== */
.home-header {
  padding: 20px 18px 12px;
  text-align: center;
}

.app-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--pink-deep);
  letter-spacing: 2px;
  margin-bottom: 4px;
  text-shadow: 1px 1px 3px rgba(255,183,197,0.3);
}
.app-title .jin { color: var(--pink-deep); }
.app-subtitle {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: 1px;
}

/* 时钟卡片 */
.clock-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  text-align: center;
  border: 2px solid var(--pink-light);
  position: relative;
  overflow: hidden;
}
.clock-card::before {
  content: '🌙';
  position: absolute;
  top: 8px; right: 14px;
  font-size: 18px;
  opacity: 0.5;
}
.clock-time {
  font-size: 42px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
.clock-time .colon { color: var(--pink-deep); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.clock-date {
  font-size: 14px;
  color: var(--text-soft);
  margin-top: 6px;
}
.clock-week {
  display: inline-block;
  background: var(--pink-light);
  color: var(--pink-deep);
  padding: 2px 14px;
  border-radius: 20px;
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

/* 标语栏 */
.slogan-card {
  background: linear-gradient(135deg, #FFF5E8, #FFEFF4);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--blue-light);
  position: relative;
}
.slogan-card::before {
  content: '✏️';
  position: absolute;
  top: 10px; right: 14px;
  font-size: 16px;
  opacity: 0.4;
}
.slogan-label {
  font-size: 12px;
  color: var(--blue);
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.slogan-text {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.6;
}
.slogan-actions { margin-top: 10px; display: flex; gap: 8px; }
.slogan-btn {
  font-size: 12px;
  padding: 5px 14px;
  border: none;
  border-radius: 20px;
  background: var(--pink-light);
  color: var(--pink-deep);
  cursor: pointer;
  font-weight: 600;
}
.slogan-btn:hover { background: var(--pink-main); color: white; }

/* 励志短句 */
.motto-card {
  background: linear-gradient(135deg, var(--blue-light), #FFF5E8);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--yellow-light);
  position: relative;
}
.motto-card::before {
  content: '⭐';
  position: absolute;
  top: 10px; right: 14px;
  font-size: 16px;
  opacity: 0.5;
}
.motto-label {
  font-size: 12px;
  color: var(--yellow);
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.motto-text {
  font-size: 15px;
  color: var(--text-main);
  font-weight: 500;
  line-height: 1.7;
}

/* 装饰贴纸区 - 散乱分布 */
.sticker-bar {
  position: relative;
  height: 90px;
  padding: 8px 16px;
  margin: 8px 16px;
}
.sticker-item {
  position: absolute;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
  transition: transform 0.3s;
  cursor: pointer;
}
.sticker-item:hover { transform: scale(1.2) rotate(10deg); }
.sticker-item:nth-child(odd) { animation: float 3s ease-in-out infinite; }
.sticker-item:nth-child(even) { animation: float 3s ease-in-out infinite 1.5s; }
@keyframes float {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-6px) rotate(3deg); }
}

/* 快捷入口网格 */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 12px 16px;
}
.quick-item {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.3s;
}
.quick-item:hover { border-color: var(--pink-light); transform: translateY(-2px); }
.quick-item .icon { font-size: 28px; margin-bottom: 6px; }
.quick-item .name { font-size: 12px; color: var(--text-soft); font-weight: 600; }

/* ===== 侧边抽屉 ===== */
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(90, 74, 82, 0.4);
  z-index: 998;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0; left: -300px;
  width: 280px; height: 100%;
  background: linear-gradient(180deg, #FFF5E8, #FFF0F3);
  z-index: 999;
  transition: left 0.3s ease;
  overflow-y: auto;
  box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  padding: 20px 0;
}
.drawer.open { left: 0; }

.drawer-header {
  text-align: center;
  padding: 10px 20px 20px;
  border-bottom: 2px dashed var(--pink-light);
}
.drawer-header .logo {
  width: 72px; height: 72px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 8px;
  border: 3px solid var(--pink-main);
  box-shadow: 0 4px 12px rgba(255, 194, 203, 0.3);
}
.drawer-header .logo img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.drawer-header .title { font-size: 20px; color: var(--pink-deep); font-weight: 700; margin-top: 4px; }
.drawer-header .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }

.drawer-section { padding: 16px 16px 8px; }
.drawer-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--pink-deep);
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.drawer-section-title::after {
  content: '';
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--pink-light), transparent);
  border-radius: 2px;
}

.drawer-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 8px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--card-bg);
  color: var(--text-main);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: all 0.2s;
  text-align: left;
}
.drawer-btn:hover, .drawer-btn:active {
  background: var(--pink-light);
  transform: translateX(4px);
}
.drawer-btn .ic { font-size: 22px; }

/* 菜单按钮 */
.menu-toggle {
  position: fixed;
  top: 12px; left: 12px;
  z-index: 997;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 2px solid var(--pink-light);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s;
}
.menu-toggle:hover { background: var(--pink-light); }

/* ===== 页面通用样式 ===== */
.page {
  display: none;
  padding: 0 16px 20px;
  min-height: 100vh;
  animation: fadeIn 0.2s ease;
}
.page.active {
  display: block;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  background: linear-gradient(160deg, #FFE4E9 0%, #FFF0E8 50%, #FFF5E8 100%);
  z-index: 100;
  padding-top: 56px;
}
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  padding: 8px 4px;
  position: fixed;
  top: 0; left: 0; right: 0;
  background: #FFF5E8;
  z-index: 110;
  padding-left: 60px;
  padding-right: 16px;
  box-shadow: 0 2px 8px rgba(200,160,165,0.1);
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--pink-light);
  background: var(--card-bg);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--pink-deep);
}
.page-subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 16px; padding: 0 4px; }

.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--pink-light);
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 按钮 */
.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 20px;
  background: var(--pink-main);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 3px 10px rgba(255,183,197,0.4);
}
.btn:hover { background: var(--pink-deep); transform: translateY(-1px); }
.btn-gold { background: var(--yellow); box-shadow: 0 3px 10px rgba(232,198,116,0.4); }
.btn-purple { background: var(--blue); box-shadow: 0 3px 10px rgba(212,197,226,0.4); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-outline {
  background: transparent;
  border: 2px solid var(--pink-light);
  color: var(--pink-deep);
  box-shadow: none;
}
.btn-outline:hover { background: var(--pink-light); }

/* 输入框 */
input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea, select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--pink-light);
  border-radius: var(--radius-sm);
  background: var(--milk);
  font-size: 14px;
  font-family: var(--font);
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--pink-main); }
textarea { resize: vertical; min-height: 80px; }

label.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 6px;
  margin-top: 12px;
}
label.field-label:first-child { margin-top: 0; }

/* ===== 倒计时 ===== */
.countdown-display {
  text-align: center;
  padding: 30px 20px;
  background: linear-gradient(135deg, var(--pink-light), var(--blue-light));
  border-radius: var(--radius-lg);
  border: 2px solid var(--pink-main);
}
.countdown-num {
  font-size: 64px;
  font-weight: 700;
  color: var(--pink-deep);
  line-height: 1;
}
.countdown-label { font-size: 16px; color: var(--text-soft); margin-top: 8px; }
.countdown-detail {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
}
.countdown-detail .item { text-align: center; }
.countdown-detail .num { font-size: 24px; font-weight: 700; color: var(--yellow); }
.countdown-detail .lbl { font-size: 12px; color: var(--text-light); }

/* ===== 任务打卡 ===== */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--milk);
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.task-item.done { background: var(--blue-light); border-color: var(--blue); }
.task-checkbox {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2.5px solid var(--pink-main);
  background: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-checkbox.checked { background: var(--pink-main); }
.task-checkbox.checked::after { content: '✓'; color: white; font-size: 16px; font-weight: 700; }
.task-content { flex: 1; font-size: 14px; }
.task-item.done .task-content { text-decoration: line-through; color: var(--text-light); }
.task-actions { display: flex; gap: 6px; }
.task-actions button {
  width: 28px; height: 28px;
  border: none;
  border-radius: 8px;
  background: var(--pink-light);
  cursor: pointer;
  font-size: 13px;
}

/* ===== 番茄钟 ===== */
.tomato-display {
  text-align: center;
  padding: 30px;
}
.tomato-time {
  font-size: 56px;
  font-weight: 700;
  color: var(--pink-deep);
  font-variant-numeric: tabular-nums;
}
.tomato-circle {
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 6px solid var(--pink-light);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--milk);
}
.tomato-circle.running { border-color: var(--pink-main); animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 20px var(--pink-main); } }

/* ===== 错题本 ===== */
.wrong-item {
  background: var(--milk);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid var(--pink-main);
}
.wrong-item .tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-right: 6px;
}
.tag-yanyu { background: #FFE0E9; color: #D4677E; }
.tag-panduan { background: #E3F0FC; color: #8B6BA8; }
.tag-ziliao { background: #FFF3D6; color: #B8902E; }
.tag-shuliang { background: #D9E8FF; color: #4A7BB8; }
.tag-changshi { background: #D9F0E0; color: #3A9B5E; }
.tag-shenlun { background: #FFE8D6; color: #C47A3E; }

/* OCR上传区 */
.upload-zone {
  border: 3px dashed var(--pink-light);
  border-radius: var(--radius-lg);
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--milk);
}
.upload-zone:hover { border-color: var(--pink-main); background: var(--pink-light); }
.upload-zone .icon { font-size: 40px; }
.upload-zone .text { font-size: 14px; color: var(--text-soft); margin-top: 8px; }

/* ===== 公文模板 ===== */
.template-item {
  background: var(--milk);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.template-item:hover { border-color: var(--pink-light); background: var(--pink-light); }
.template-item .name { font-weight: 600; font-size: 15px; }
.template-item .arrow { color: var(--text-light); }

/* ===== 思维导图 ===== */
.mindmap-canvas {
  width: 100%;
  height: 400px;
  background: var(--milk);
  border-radius: var(--radius-lg);
  border: 2px solid var(--pink-light);
  position: relative;
  overflow: auto;
  touch-action: pan-x pan-y;
}
.mind-node {
  position: absolute;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: move;
  user-select: none;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.mind-node.root { background: var(--pink-main); color: white; font-size: 15px; }
.mind-node.branch { background: var(--blue-light); color: var(--text-main); }
.mind-node.leaf { background: var(--yellow-light); color: var(--text-main); }

/* ===== 树洞 ===== */
.treehole-entry {
  background: linear-gradient(135deg, var(--blue-light), var(--pink-light));
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  margin-bottom: 14px;
}

/* ===== 减脂追踪 ===== */
.weight-chart {
  width: 100%;
  height: 200px;
  margin: 10px 0;
}
.weight-stat {
  display: flex;
  justify-content: space-around;
  text-align: center;
  margin: 12px 0;
}
.weight-stat .item .num { font-size: 24px; font-weight: 700; }
.weight-stat .item .lbl { font-size: 12px; color: var(--text-light); }
.weight-stat .current .num { color: var(--pink-deep); }
.weight-stat .target .num { color: var(--yellow); }
.weight-stat .diff .num { color: var(--blue); }

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(90, 74, 82, 0.5);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--cream);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 400px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  border: 2px solid var(--pink-light);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 700; color: var(--pink-deep); margin-bottom: 14px; text-align: center; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(90, 74, 82, 0.9);
  color: white;
  padding: 10px 24px;

// ========== 数据存储工具 ==========
const DB = {
  get(key, def) {
    try { const v = localStorage.getItem('jinjin_'+key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(key, val) { localStorage.setItem('jinjin_'+key, JSON.stringify(val)); }
};

// ========== Toast ==========
function toast(msg) {
  let t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}

// ========== 时钟 ==========
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockTime').innerHTML = `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}`;
  document.getElementById('clockDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('clockWeek').textContent = weeks[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// ========== 每日任务 ==========
function loadDailyTask() {
  const today = new Date().toDateString();
  const data = DB.get('dailyTask', {date:'', text:''});
  if (data.date === today && data.text) {
    document.getElementById('dailyTask').textContent = data.text;
  } else {
    document.getElementById('dailyTask').textContent = '点击「设置任务」添加今日任务';
  }
}
loadDailyTask();

function setDailyTask() {
  const current = document.getElementById('dailyTask').textContent;
  const placeholder = '点击「设置任务」添加今日任务';
  const text = prompt('请输入今日任务（可用换行写多个）：', current === placeholder ? '' : current);
  if (text !== null && text.trim()) {
    const today = new Date().toDateString();
    let history = DB.get('taskHistory', []);
    history.unshift({date: today, text: text.trim()});
    if (history.length > 100) history = history.slice(0, 100);
    DB.set('taskHistory', history);
    DB.set('dailyTask', {date: today, text: text.trim()});
    document.getElementById('dailyTask').textContent = text.trim();
    toast('任务已更新 📋');
  }
}

function viewTaskHistory() {
  const history = DB.get('taskHistory', []);
  if (history.length === 0) { toast('暂无历史记录'); return; }
  let html = '<div class="modal-title">📜 任务历史</div>';
  history.forEach(h => {
    const d = new Date(h.date);
    html += `<div style="padding:10px;border-bottom:1px dashed var(--pink-light);font-size:13px;"><div style="color:var(--text-light);font-size:11px;">${d.getMonth()+1}月${d.getDate()}日</div><div>${h.text}</div></div>`;
  });
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>';

// 左滑手势
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // 左滑开菜单（从左边缘20px范围内右滑，或在菜单打开时左滑关闭）
  if (touchStartX < 30 && dx > 50 && Math.abs(dy) < 40) {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  }
  if (dx < -50 && Math.abs(dy) < 40 && document.getElementById('drawer').classList.contains('open')) {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }
});

// ========== 页面路由 ==========
function openPage(name) {
  closeDrawer(); // 先关抽屉（确保关闭，不会误开）
  const container = document.getElementById('pages-container');
  // 隐藏首页
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-home').style.display = 'none';

  // 移除其他页面
  container.querySelectorAll('.page').forEach(p => p.remove());

  // 加载对应页面
  const pageFn = window['page_' + name];
  if (pageFn) {
    const pageEl = pageFn();
    container.appendChild(pageEl);
    pageEl.classList.add('active');
    // 确保页面从最顶部开始显示——滚动页面自身而非window
    setTimeout(() => {
      pageEl.scrollTop = 0;
      window.scrollTo(0, 0);
      document.body.scrollTop = 0;
      document.documentElement.scrollTop = 0;
    }, 10);

    // 页面加载后回调
    if (window['afterPage_' + name]) window['afterPage_' + name]();
  } else {
    toast('页面开发中...');
    document.getElementById('page-home').classList.add('active');
    document.getElementById('page-home').style.display = '';
  }
}

function goHome() {
  document.getElementById('pages-container').querySelectorAll('.page').forEach(p => p.remove());
  document.getElementById('page-home').style.display = '';
  document.getElementById('page-home').classList.add('active');
  window.scrollTo(0, 0);
}

// ===== 动态烟花（Canvas 粒子动画）=====
let fireworkCanvas = null;
let fireworkCtx = null;
let fireworkParticles = [];
let fireworkAnimating = false;

function getFireworkCanvas() {
  if (fireworkCanvas) return fireworkCanvas;
  fireworkCanvas = document.createElement('canvas');
  fireworkCanvas.style.cssText = 'position:fixed;inset:0;z-index:2500;pointer-events:none;';
  fireworkCanvas.width = window.innerWidth;
  fireworkCanvas.height = window.innerHeight;
  document.body.appendChild(fireworkCanvas);
  fireworkCtx = fireworkCanvas.getContext('2d');
  window.addEventListener('resize', () => {
    if (fireworkCanvas) {
      fireworkCanvas.width = window.innerWidth;
      fireworkCanvas.height = window.innerHeight;
    }
  });
  return fireworkCanvas;
}

function launchFireworkParticle(x, y) {
  const colors = [
    '255,100,150', '255,180,80', '100,200,255', '180,120,255',
    '255,220,100', '120,255,180', '255,90,90', '80,180,255'
  ];
  const color = colors[Math.floor(Math.random() * colors.length)];
  const count = 40 + Math.floor(Math.random() * 20);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
    const speed = 2 + Math.random() * 5;
    fireworkParticles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1.0,
      decay: 0.008 + Math.random() * 0.012,
      color: color,
      size: 2 + Math.random() * 3
    });
  }
}

function animateFireworks() {
  if (!fireworkCtx) return;
  fireworkCtx.fillStyle = 'rgba(0,0,0,0.15)';
  fireworkCtx.fillRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
  
  fireworkParticles = fireworkParticles.filter(p => p.life > 0);
  
  fireworkParticles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05; // gravity
    p.vx *= 0.99;
    p.vy *= 0.99;
    p.life -= p.decay;
    
    const alpha = Math.max(0, p.life);
    fireworkCtx.beginPath();
    fireworkCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    fireworkCtx.fillStyle = `rgba(${p.color},${alpha})`;
    fireworkCtx.fill();
    
    // glow effect
    fireworkCtx.beginPath();
    fireworkCtx.arc(p.x, p.y, p.size * p.life * 2, 0, Math.PI * 2);
    fireworkCtx.fillStyle = `rgba(${p.color},${alpha * 0.2})`;
    fireworkCtx.fill();
  });
  
  if (fireworkParticles.length > 0 || fireworkAnimating) {
    requestAnimationFrame(animateFireworks);
  } else {
    fireworkCtx.clearRect(0, 0, fireworkCanvas.width, fireworkCanvas.height);
  }
}

// 烟花连放秀——专注结束时触发
function triggerFireworkShow() {
  const canvas = getFireworkCanvas();
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  fireworkParticles = [];
  fireworkAnimating = true;
  
  // 连续发射多波烟花
  const launchOne = () => {
    const x = window.innerWidth * (0.2 + Math.random() * 0.6);
    const y = window.innerHeight * (0.15 + Math.random() * 0.4);
    launchFireworkParticle(x, y);
  };
  
  // 第一波：3朵
  launchOne();
  setTimeout(launchOne, 100);
  setTimeout(launchOne, 200);
  // 第二波
  setTimeout(launchOne, 600);
  setTimeout(launchOne, 700);
  // 第三波
  setTimeout(launchOne, 1200);
  setTimeout(launchOne, 1300);
  setTimeout(launchOne, 1400);
  // 大 finale
  setTimeout(launchOne, 1900);
  setTimeout(launchOne, 1950);
  setTimeout(launchOne, 2000);
  
  // 启动动画
  animateFireworks();
  // 3秒后停止
  setTimeout(() => { fireworkAnimating = false; }, 3000);
}
