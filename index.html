<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="瑾瑾工作台">
<meta name="theme-color" content="#FFC2CB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>瑾瑾的工作台</title>
<style>
/* ===== 全局变量与基础设定 ===== */
:root {
  --pink-main: #FFC2CB;       /* 桃粉 */
  --pink-light: #FFE4E9;      /* 浅桃粉 */
  --pink-deep: #E88A9A;       /* 深桃粉 */
  --cream: #FFF5E8;           /* 奶白色 */
  --milk: #FFFDFB;            /* 牛奶白 */
  --blue: #BED7F3;            /* 海盐蓝 */
  --blue-light: #E3F0FC;
  --yellow: #FFE8A3;          /* 芝士黄 */
  --yellow-light: #FFF5D6;
  --text-main: #6B545C;       /* 柔和主文字色 */
  --text-soft: #9A858D;       /* 柔和次文字色 */
  --text-light: #C0A8B0;
  --card-bg: rgba(255, 255, 255, 0.97);
  --shadow-soft: 0 4px 16px rgba(255, 194, 203, 0.2);
  --shadow-card: 0 6px 20px rgba(200, 160, 165, 0.12);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  font-family: var(--font);
  background: linear-gradient(160deg, #FFE4E9 0%, #FFF0E8 50%, #FFF5E8 100%);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* 背景装饰贴纸 */
body::before, body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  z-index: 0;
  opacity: 0.35;
  pointer-events: none;
}
body::before {
  width: 200px; height: 200px;
  background: radial-gradient(circle, #FFD9E0, transparent 70%);
  top: -60px; right: -60px;
}
body::after {
  width: 250px; height: 250px;
  background: radial-gradient(circle, #E3F0FC, transparent 70%);
  bottom: -80px; left: -80px;
}

/* ===== 主容器 ===== */
#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 30px;
}

/* ===== 首页布局 ===== */
.home-header {
  padding: 20px 18px 12px;
  text-align: center;
}

.app-title {
  font-size: 26px;
  font-weight: 700;
  color: var(--pink-deep);
  letter-spacing: 2px;
  margin-bottom: 4px;
  text-shadow: 1px 1px 3px rgba(255,183,197,0.3);
}
.app-title .jin { color: var(--yellow); }
.app-subtitle {
  font-size: 12px;
  color: var(--text-light);
  letter-spacing: 1px;
}

/* 时钟卡片 */
.clock-card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  text-align: center;
  border: 2px solid var(--pink-light);
  position: relative;
  overflow: hidden;
}
.clock-card::before {
  content: '🌙';
  position: absolute;
  top: 8px; right: 14px;
  font-size: 18px;
  opacity: 0.5;
}
.clock-time {
  font-size: 42px;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
}
.clock-time .colon { color: var(--pink-deep); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }
.clock-date {
  font-size: 14px;
  color: var(--text-soft);
  margin-top: 6px;
}
.clock-week {
  display: inline-block;
  background: var(--pink-light);
  color: var(--pink-deep);
  padding: 2px 14px;
  border-radius: 20px;
  font-size: 13px;
  margin-top: 8px;
  font-weight: 600;
}

/* 标语栏 */
.slogan-card {
  background: linear-gradient(135deg, #FFF5E8, #FFEFF4);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--blue-light);
  position: relative;
}
.slogan-card::before {
  content: '✏️';
  position: absolute;
  top: 10px; right: 14px;
  font-size: 16px;
  opacity: 0.4;
}
.slogan-label {
  font-size: 12px;
  color: var(--blue);
  font-weight: 600;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.slogan-text {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.6;
}
.slogan-actions { margin-top: 10px; display: flex; gap: 8px; }
.slogan-btn {
  font-size: 12px;
  padding: 5px 14px;
  border: none;
  border-radius: 20px;
  background: var(--pink-light);
  color: var(--pink-deep);
  cursor: pointer;
  font-weight: 600;
}
.slogan-btn:hover { background: var(--pink-main); color: white; }

/* 励志短句 */
.motto-card {
  background: linear-gradient(135deg, var(--blue-light), #FFF5E8);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin: 12px 16px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--yellow-light);
  position: relative;
}
.motto-card::before {
  content: '⭐';
  position: absolute;
  top: 10px; right: 14px;
  font-size: 16px;
  opacity: 0.5;
}
.motto-label {
  font-size: 12px;
  color: var(--yellow);
  font-weight: 700;
  margin-bottom: 6px;
  letter-spacing: 1px;
}
.motto-text {
  font-size: 15px;
  color: var(--text-main);
  font-weight: 500;
  line-height: 1.7;
}

/* 装饰贴纸区 */
.sticker-bar {
  display: flex;
  justify-content: space-around;
  padding: 16px 20px;
  margin: 8px 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.sticker-item {
  font-size: 32px;
  filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.1));
  transition: transform 0.3s;
  cursor: pointer;
}
.sticker-item:hover { transform: scale(1.2) rotate(5deg); }
.sticker-item:nth-child(odd) { animation: float 3s ease-in-out infinite; }
.sticker-item:nth-child(even) { animation: float 3s ease-in-out infinite 1.5s; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* 快捷入口网格 */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 12px 16px;
}
.quick-item {
  background: var(--card-bg);
  border-radius: var(--radius-md);
  padding: 16px 8px;
  text-align: center;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.3s;
}
.quick-item:hover { border-color: var(--pink-light); transform: translateY(-2px); }
.quick-item .icon { font-size: 28px; margin-bottom: 6px; }
.quick-item .name { font-size: 12px; color: var(--text-soft); font-weight: 600; }

/* ===== 侧边抽屉 ===== */
.drawer-overlay {
  position: fixed; inset: 0;
  background: rgba(90, 74, 82, 0.4);
  z-index: 998;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0; left: -300px;
  width: 280px; height: 100%;
  background: linear-gradient(180deg, #FFF5E8, #FFF0F3);
  z-index: 999;
  transition: left 0.3s ease;
  overflow-y: auto;
  box-shadow: 4px 0 20px rgba(0,0,0,0.1);
  padding: 20px 0;
}
.drawer.open { left: 0; }

.drawer-header {
  text-align: center;
  padding: 10px 20px 20px;
  border-bottom: 2px dashed var(--pink-light);
}
.drawer-header .logo { font-size: 36px; }
.drawer-header .title { font-size: 20px; color: var(--pink-deep); font-weight: 700; margin-top: 4px; }
.drawer-header .sub { font-size: 12px; color: var(--text-light); margin-top: 4px; }

.drawer-section { padding: 16px 16px 8px; }
.drawer-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--yellow);
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.drawer-section-title::after {
  content: '';
  flex: 1;
  height: 2px;
  background: linear-gradient(90deg, var(--yellow-light), transparent);
  border-radius: 2px;
}

.drawer-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 12px 16px;
  margin-bottom: 8px;
  border: none;
  border-radius: var(--radius-md);
  background: var(--card-bg);
  color: var(--text-main);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-soft);
  transition: all 0.2s;
  text-align: left;
}
.drawer-btn:hover, .drawer-btn:active {
  background: var(--pink-light);
  transform: translateX(4px);
}
.drawer-btn .ic { font-size: 22px; }

/* 菜单按钮 */
.menu-toggle {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 997;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--card-bg);
  border: 2px solid var(--pink-light);
  box-shadow: var(--shadow-card);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.2s;
}
.menu-toggle:hover { background: var(--pink-light); }

/* ===== 页面通用样式 ===== */
.page {
  display: none;
  padding: 64px 16px 30px;
  min-height: 100vh;
  animation: fadeIn 0.3s ease;
}
.page.active { display: block; }
@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

.page-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding: 0 4px;
}
.back-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 2px solid var(--pink-light);
  background: var(--card-bg);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--pink-deep);
}
.page-subtitle { font-size: 13px; color: var(--text-light); margin-bottom: 16px; padding: 0 4px; }

.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
  border: 2px solid var(--pink-light);
}
.card-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 按钮 */
.btn {
  padding: 10px 22px;
  border: none;
  border-radius: 20px;
  background: var(--pink-main);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 3px 10px rgba(255,183,197,0.4);
}
.btn:hover { background: var(--pink-deep); transform: translateY(-1px); }
.btn-gold { background: var(--yellow); box-shadow: 0 3px 10px rgba(232,198,116,0.4); }
.btn-purple { background: var(--blue); box-shadow: 0 3px 10px rgba(212,197,226,0.4); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-outline {
  background: transparent;
  border: 2px solid var(--pink-light);
  color: var(--pink-deep);
  box-shadow: none;
}
.btn-outline:hover { background: var(--pink-light); }

/* 输入框 */
input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea, select {
  width: 100%;
  padding: 10px 14px;
  border: 2px solid var(--pink-light);
  border-radius: var(--radius-sm);
  background: var(--milk);
  font-size: 14px;
  font-family: var(--font);
  color: var(--text-main);
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--pink-main); }
textarea { resize: vertical; min-height: 80px; }

label.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 6px;
  margin-top: 12px;
}
label.field-label:first-child { margin-top: 0; }

/* ===== 倒计时 ===== */
.countdown-display {
  text-align: center;
  padding: 30px 20px;
  background: linear-gradient(135deg, var(--pink-light), var(--blue-light));
  border-radius: var(--radius-lg);
  border: 2px solid var(--pink-main);
}
.countdown-num {
  font-size: 64px;
  font-weight: 700;
  color: var(--pink-deep);
  line-height: 1;
}
.countdown-label { font-size: 16px; color: var(--text-soft); margin-top: 8px; }
.countdown-detail {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 16px;
}
.countdown-detail .item { text-align: center; }
.countdown-detail .num { font-size: 24px; font-weight: 700; color: var(--yellow); }
.countdown-detail .lbl { font-size: 12px; color: var(--text-light); }

/* ===== 任务打卡 ===== */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--milk);
  border-radius: var(--radius-md);
  margin-bottom: 8px;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.task-item.done { background: var(--blue-light); border-color: var(--blue); }
.task-checkbox {
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2.5px solid var(--pink-main);
  background: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.task-checkbox.checked { background: var(--pink-main); }
.task-checkbox.checked::after { content: '✓'; color: white; font-size: 16px; font-weight: 700; }
.task-content { flex: 1; font-size: 14px; }
.task-item.done .task-content { text-decoration: line-through; color: var(--text-light); }
.task-actions { display: flex; gap: 6px; }
.task-actions button {
  width: 28px; height: 28px;
  border: none;
  border-radius: 8px;
  background: var(--pink-light);
  cursor: pointer;
  font-size: 13px;
}

/* ===== 番茄钟 ===== */
.tomato-display {
  text-align: center;
  padding: 30px;
}
.tomato-time {
  font-size: 56px;
  font-weight: 700;
  color: var(--pink-deep);
  font-variant-numeric: tabular-nums;
}
.tomato-circle {
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 6px solid var(--pink-light);
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: var(--milk);
}
.tomato-circle.running { border-color: var(--pink-main); animation: pulse 2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 20px var(--pink-main); } }

/* ===== 错题本 ===== */
.wrong-item {
  background: var(--milk);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  border-left: 4px solid var(--pink-main);
}
.wrong-item .tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin-right: 6px;
}
.tag-yanyu { background: #FFE0E9; color: #D4677E; }
.tag-panduan { background: #E3F0FC; color: #8B6BA8; }
.tag-ziliao { background: #FFF3D6; color: #B8902E; }
.tag-shuliang { background: #D9E8FF; color: #4A7BB8; }
.tag-changshi { background: #D9F0E0; color: #3A9B5E; }
.tag-shenlun { background: #FFE8D6; color: #C47A3E; }

/* OCR上传区 */
.upload-zone {
  border: 3px dashed var(--pink-light);
  border-radius: var(--radius-lg);
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--milk);
}
.upload-zone:hover { border-color: var(--pink-main); background: var(--pink-light); }
.upload-zone .icon { font-size: 40px; }
.upload-zone .text { font-size: 14px; color: var(--text-soft); margin-top: 8px; }

/* ===== 公文模板 ===== */
.template-item {
  background: var(--milk);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.template-item:hover { border-color: var(--pink-light); background: var(--pink-light); }
.template-item .name { font-weight: 600; font-size: 15px; }
.template-item .arrow { color: var(--text-light); }

/* ===== 思维导图 ===== */
.mindmap-canvas {
  width: 100%;
  height: 400px;
  background: var(--milk);
  border-radius: var(--radius-lg);
  border: 2px solid var(--pink-light);
  position: relative;
  overflow: auto;
  touch-action: pan-x pan-y;
}
.mind-node {
  position: absolute;
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  cursor: move;
  user-select: none;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.mind-node.root { background: var(--pink-main); color: white; font-size: 15px; }
.mind-node.branch { background: var(--blue-light); color: var(--text-main); }
.mind-node.leaf { background: var(--yellow-light); color: var(--text-main); }

/* ===== 树洞 ===== */
.treehole-entry {
  background: linear-gradient(135deg, var(--blue-light), var(--pink-light));
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  margin-bottom: 14px;
}

/* ===== 减脂追踪 ===== */
.weight-chart {
  width: 100%;
  height: 200px;
  margin: 10px 0;
}
.weight-stat {
  display: flex;
  justify-content: space-around;
  text-align: center;
  margin: 12px 0;
}
.weight-stat .item .num { font-size: 24px; font-weight: 700; }
.weight-stat .item .lbl { font-size: 12px; color: var(--text-light); }
.weight-stat .current .num { color: var(--pink-deep); }
.weight-stat .target .num { color: var(--yellow); }
.weight-stat .diff .num { color: var(--blue); }

/* ===== 弹窗 ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(90, 74, 82, 0.5);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--cream);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 400px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  border: 2px solid var(--pink-light);
  animation: modalIn 0.3s ease;
}
@keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-title { font-size: 18px; font-weight: 700; color: var(--pink-deep); margin-bottom: 14px; text-align: center; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* Toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(90, 74, 82, 0.9);
  color: white;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 3000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* 动画特效层 */
#effect-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 2500;
  overflow: hidden;
}

/* ===== 底部提示 ===== */
.home-tip {
  text-align: center;
  padding: 20px 16px;
  font-size: 12px;
  color: var(--text-light);
}
.home-tip .heart { color: var(--pink-main); }

/* 滚动条 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--pink-light); border-radius: 4px; }

</style>
</head>
<body>

<!-- 菜单按钮 -->
<div class="menu-toggle" onclick="toggleDrawer()">☰</div>

<!-- 特效层 -->
<div id="effect-layer"></div>

<!-- 侧边抽屉 -->
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="logo">🐟</div>

<div id="pages-container"></div>

<script>
// ========== 数据存储工具 ==========
const DB = {
  get(key, def) {
    try { const v = localStorage.getItem('jinjin_'+key); return v ? JSON.parse(v) : def; }
    catch(e) { return def; }
  },
  set(key, val) { localStorage.setItem('jinjin_'+key, JSON.stringify(val)); }
};

// ========== Toast ==========
function toast(msg) {
  let t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 2000);
}

// ========== 时钟 ==========
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clockTime').innerHTML = `${h}<span class="colon">:</span>${m}<span class="colon">:</span>${s}`;
  document.getElementById('clockDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;
  const weeks = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('clockWeek').textContent = weeks[now.getDay()];
}
setInterval(updateClock, 1000);
updateClock();

// ========== 河南省考每日励志 ==========
const mottos = [
  "乾坤未定，你我皆是黑马。河南省考，一举上岸！",
  "每天进步一点点，上岸锦鲤就在前方等你。",
  "行测刷题千遍，其义自见；申论练笔万次，下笔有神。",
  "河南学子多奇志，公考路上不言弃。",
  "今日的汗水，是明日上岸的通行证。",
  "中原大地任驰骋，公务员梦终成真。",
  "别人刷的是手机，你刷的是真题——这就是差距。",
  "言语判断资料数量常识，五大模块逐一击破。",
  "申论不是玄学，是逻辑与积累的艺术。",
  "凌晨的灯不会白亮，清晨的书不会白读。",
  "省考路上没有捷径，每一步都算数。",
  "把每一次模考当作实战，把实战当作模考。",
  "与其羡慕别人上岸，不如自己埋头苦干。",
  "申论踩分靠的是关键词，上岸靠的是每一天。",
  "错题本是你的宝藏，反复看才能不丢分。",
  "时政热点日日积累，考场上方有话可说。",
  "专注当下的一题一书，未来自会给你答案。",
  "备考如登山，坚持到顶峰的人才能看到日出。",
  "今日不努力刷题，明日努力找工作。",
  "行测时间不够？练的就是速度与准确率的平衡。",
  "申论大作文立意要高，落笔要实。",
  "公考不是比谁聪明，是比谁能坚持到最后。",
  "豫见公考，遇见更好的自己。",
  "每一次模拟都是进步，每一次错题都是收获。",
  "星光不问赶路人，时光不负有心人。",
  "做足准备，静待花开。2027河南省考，瑾瑾必上岸！"
];
function getDailyMotto() {
  const day = Math.floor(Date.now() / 86400000);
  return mottos[day % mottos.length];
}
document.getElementById('mottoText').textContent = getDailyMotto();

// ========== 标语栏 ==========
function loadSlogan() {
  const today = new Date().toDateString();
  const data = DB.get('slogan', {date:'', text:''});
  if (data.date === today && data.text) {
    document.getElementById('sloganText').textContent = data.text;
  } else {
    document.getElementById('sloganText').textContent = '点击「更换文案」设置今日标语';
  }
}
loadSlogan();

function setSlogan() {
  const text = prompt('请输入今日标语：', document.getElementById('sloganText').textContent === '点击「更换文案」设置今日标语' ? '' : document.getElementById('sloganText').textContent);
  if (text !== null && text.trim()) {
    const today = new Date().toDateString();
    let history = DB.get('sloganHistory', []);
    history.unshift({date: today, text: text.trim()});
    if (history.length > 100) history = history.slice(0, 100);
    DB.set('sloganHistory', history);
    DB.set('slogan', {date: today, text: text.trim()});
    document.getElementById('sloganText').textContent = text.trim();
    toast('标语已更新 ✨');
  }
}

function viewSloganHistory() {
  const history = DB.get('sloganHistory', []);
  if (history.length === 0) { toast('暂无历史记录'); return; }
  let html = '<div class="modal-title">📜 标语历史</div>';
  history.forEach(h => {
    const d = new Date(h.date);
    html += `<div style="padding:10px;border-bottom:1px dashed var(--pink-light);font-size:13px;"><div style="color:var(--text-light);font-size:11px;">${d.getMonth()+1}月${d.getDate()}日</div><div>${h.text}</div></div>`;
  });
  html += '<div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button></div>';
  showModal(html);
}

// ========== 模态框 ==========
function showModal(html) {
  let overlay = document.getElementById('modalOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modalOverlay';
    overlay.className = 'modal-overlay';
    overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.classList.add('open');
}
function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.classList.remove('open');
}

// ========== 侧边抽屉 ==========
function toggleDrawer() {
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('drawerOverlay').classList.toggle('open');
}

// 左滑手势
let touchStartX = 0, touchStartY = 0;
document.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  // 左滑开菜单（从左边缘20px范围内右滑，或在菜单打开时左滑关闭）
  if (touchStartX < 30 && dx > 50 && Math.abs(dy) < 40) {
    document.getElementById('drawer').classList.add('open');
    document.getElementById('drawerOverlay').classList.add('open');
  }
  if (dx < -50 && Math.abs(dy) < 40 && document.getElementById('drawer').classList.contains('open')) {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerOverlay').classList.remove('open');
  }
});

// ========== 页面路由 ==========
function openPage(name) {
  toggleDrawer(); // 先关抽屉
  const container = document.getElementById('pages-container');
  // 隐藏首页
  document.getElementById('page-home').classList.remove('active');
  document.getElementById('page-home').style.display = 'none';

  // 移除其他页面
  container.querySelectorAll('.page').forEach(p => p.remove());

  // 加载对应页面
  const pageFn = window['page_' + name];
  if (pageFn) {
    const pageEl = pageFn();
    container.appendChild(pageEl);
    pageEl.classList.add('active');
    window.scrollTo(0, 0);

    // 页面加载后回调
    if (window['afterPage_' + name]) window['afterPage_' + name]();
  } else {
    toast('页面开发中...');
    document.getElementById('page-home').classList.add('active');
    document.getElementById('page-home').style.display = '';
  }
}

function goHome() {
  document.getElementById('pages-container').querySelectorAll('.page').forEach(p => p.remove());
  document.getElementById('page-home').style.display = '';
  document.getElementById('page-home').classList.add('active');
  window.scrollTo(0, 0);
}

function createPageBase(title, subtitle) {
  const div = document.createElement('div');
  div.className = 'page active';
  div.innerHTML = `
    <div class="page-header">
      <button class="back-btn" onclick="goHome()">←</button>
      <div>
        <div class="page-title">${title}</div>
        ${subtitle ? `<div style="font-size:12px;color:var(--text-light);">${subtitle}</div>` : ''}
      </div>
    </div>
  `;
  return div;
}

// ========== 动画特效系统 ==========
function triggerEffect(type) {
  const layer = document.getElementById('effect-layer');
  const types = type || ['star','koi','ribbon','firework'];
  const t = types[Math.floor(Math.random() * types.length)];

  if (t === 'star') {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => createStar(layer), i * 50);
    }
  } else if (t === 'koi') {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => createKoi(layer), i * 200);
    }
  } else if (t === 'ribbon') {
    for (let i = 0; i < 25; i++) {
      setTimeout(() => createRibbon(layer), i * 60);
    }
  } else if (t === 'firework') {
    for (let i = 0; i < 6; i++) {
      setTimeout(() => createFirework(layer), i * 300);
    }
  }
}

function createStar(layer) {
  const el = document.createElement('div');
  el.textContent = ['✨','⭐','🌟','💫'][Math.floor(Math.random()*4)];
  el.style.cssText = `position:absolute;font-size:${20+Math.random()*20}px;left:${Math.random()*100}%;top:-30px;transition:all 2s ease-out;opacity:1;`;
  layer.appendChild(el);
  setTimeout(() => {
    el.style.top = '110%';
    el.style.transform = `rotate(${Math.random()*720}deg)`;
    el.style.opacity = '0';
  }, 10);
  setTimeout(() => el.remove(), 2100);
}

function createKoi(layer) {
  const el = document.createElement('div');
  el.textContent = '🐟';
  el.style.cssText = `position:absolute;font-size:36px;left:-50px;top:${20+Math.random()*60}%;transition:all 3s ease-in-out;opacity:1;`;
  layer.appendChild(el);
  setTimeout(() => {
    el.style.left = '110%';
    el.style.transform = `translateY(${Math.random()*100-50}px) rotate(${Math.random()*30}deg)`;
  }, 10);
  setTimeout(() => el.remove(), 3100);
}

function createRibbon(layer) {
  const el = document.createElement('div');
  el.textContent = '🎀';
  el.style.cssText = `position:absolute;font-size:${16+Math.random()*16}px;left:${Math.random()*100}%;top:-30px;transition:all 3s ease-in;opacity:1;`;
  layer.appendChild(el);
  setTimeout(() => {
    el.style.top = '110%';
    el.style.transform = `translateX(${Math.random()*100-50}px) rotate(${Math.random()*360}deg)`;
    el.style.opacity = '0';
  }, 10);
  setTimeout(() => el.remove(), 3100);
}

function createFirework(layer) {
  const cx = 20 + Math.random() * 60;
  const cy = 20 + Math.random() * 40;
  const colors = ['🎉','🎊','✨','⭐','🌟'];
  for (let i = 0; i < 15; i++) {
    const el = document.createElement('div');
    el.textContent = colors[Math.floor(Math.random()*colors.length)];
    const angle = (i / 15) * Math.PI * 2;
    const dist = 80 + Math.random() * 60;
    el.style.cssText = `position:absolute;font-size:24px;left:${cx}%;top:${cy}%;transition:all 1s ease-out;opacity:1;`;
    layer.appendChild(el);
    setTimeout(() => {
      el.style.left = (cx + Math.cos(angle) * dist * 0.15) + '%';
      el.style.top = (cy + Math.sin(angle) * dist * 0.2) + '%';
      el.style.opacity = '0';
      el.style.fontSize = '8px';
    }, 10);
    setTimeout(() => el.remove(), 1100);
  }
}

function triggerGrandEffect() {
  const layer = document.getElementById('effect-layer');
  // 连续触发多种特效
  triggerEffect(['star','ribbon']);
  setTimeout(() => triggerEffect(['koi']), 500);
  setTimeout(() => triggerEffect(['firework']), 1000);
  setTimeout(() => triggerEffect(['star','ribbon']), 1500);
  setTimeout(() => triggerEffect(['firework']), 2000);

  // 全屏祝福
  const banner = document.createElement('div');
  banner.style.cssText = `position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:2600;pointer-events:none;`;
  banner.innerHTML = `<div style="background:linear-gradient(135deg,var(--pink-main),var(--yellow));color:white;padding:30px 40px;border-radius:24px;font-size:24px;font-weight:700;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.2);animation:modalIn 0.5s ease;">🎉 今日全部完成！<br>上岸锦鲤护体！🐟</div>`;
  document.body.appendChild(banner);
  setTimeout(() => { banner.style.transition = 'opacity 0.5s'; banner.style.opacity = '0'; setTimeout(() => banner.remove(), 500); }, 3500);
}

console.log('瑾瑾的工作台 V1.0 已加载 💕');
</script>
